---
grails:
    profile: web
    codegen:
        defaultPackage: gestion.extrait.api
    gorm:
        reactor:
            events: false
    cors:
        enabled: true
        allowedOrigins:
            - 'http://localhost:4200'
        allowedMethods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
            - HEAD
        allowedHeaders:
            - Authorization
            - Content-Type
            - Accept
            - Origin
            - X-Requested-With
        exposedHeaders:
            - Authorization
        maxAge: 3600
        allowCredentials: false
    urlmapping:
        cache:
            maxsize: 1000
    controllers:
        defaultScope: singleton
    converters:
        encoding: UTF-8

app:
    extraits:
        dossier: extraits

info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'

spring:
    security:
        enabled: false
    autoconfigure:
        exclude:
            - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
            - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
    jmx:
        unique-names: true
    main:
        banner-mode: "off"
    groovy:
        template:
            check-template-location: false
    devtools:
        restart:
            additional-exclude:
                - '*.gsp'
                - '**/*.gsp'
                - '*.gson'
                - '**/*.gson'
                - 'logback-spring.xml'
                - '*.properties'

environments:
    development:
        management:
            endpoints:
                enabled-by-default: true
                web:
                    base-path: '/actuator'
                    exposure:
                        include: '*'
    production:
        management:
            endpoints:
                enabled-by-default: false

---
hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
    hbm2ddl:
        auto: update

dataSource:
    pooled: true
    jmxExport: true
    driverClassName: org.postgresql.Driver
    dialect: org.hibernate.dialect.PostgreSQLDialect
    username: postgres
    password: 12345678

environments:
    development:
        dataSource:
            dbCreate: update
            url: jdbc:postgresql://localhost:5432/extrait_naissance

    test:
        dataSource:
            dbCreate: update
            url: jdbc:postgresql://localhost:5432/extrait_naissance_test

    production:
        dataSource:
            dbCreate: none
            url: jdbc:postgresql://localhost:5432/extrait_naissance
            properties:
                jmxEnabled: true
                initialSize: 5
                maxActive: 50
                minIdle: 5
                maxIdle: 25
                maxWait: 10000
                maxAge: 600000
                timeBetweenEvictionRunsMillis: 5000
                minEvictableIdleTimeMillis: 60000
                validationQuery: SELECT 1
                validationQueryTimeout: 3
                validationInterval: 15000
                testOnBorrow: true
                testWhileIdle: true
                testOnReturn: false
                jdbcInterceptors: ConnectionState
                defaultTransactionIsolation: 2